name: Build

# Every push builds two things: the core's tests, which need only a JDK, and a
# debug APK you can install on a phone. The APK is attached to the run as an
# artifact, so there is nothing to build locally just to try the app — the same
# reason the web build deploys itself to Pages on every push.
on:
  push:
    # Work branches build too. There is no Android SDK on a development
    # machine here, so CI is the ONLY place :app is compiled at all — limiting
    # the APK job to main meant every change to the Android half went unbuilt
    # until it merged, which is exactly backwards.
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core tests (no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # -PcoreOnly excludes :app outright. A runner has ANDROID_HOME set
      # whether or not you want it, so without this the job that is meant to
      # prove core needs no SDK quietly configures the Android module too.
      - run: ./gradlew :core:test -PcoreOnly --no-daemon
      # The APK job proves :app compiles, which is not the same as
      # proving it launches: a control read before its builder has made
      # it is a runtime fault, and it kept the app from opening at all
      # for four commits. This is the check that sees it.
      - run: python3 tools/initorder.py

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # THE CHECK THAT ACTUALLY STARTS THE APP.
      #
      # "CI proves the code compiles. It never launches the app" was true of
      # every job here, and it is how a null field and a staging bar that
      # never appeared both shipped. Robolectric runs the real framework and
      # the real merged resources on the JVM, so the activity is constructed
      # for real and its view tree can be asked whether the app came up on
      # Home with the canvas put away. No emulator, no device, no KVM.
      - run: ./gradlew :app:testDebugUnitTest --no-daemon
      - run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: anvil-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # THE JOB THAT LOOKS AT THE APP.
  #
  # Everything else stops at the edge of the GPU: core is pure maths and
  # Robolectric never draws a frame, so anything only true on screen — a guide
  # veiling the ink painted on it, an orange line that may not be orange — has
  # been checked by a person installing the APK and looking, and by nothing
  # else. This runs a real emulator with a software GL driver, drives the app
  # to a few states and photographs each one.
  #
  # The pictures go up as an artifact, which is the point: they can be fetched
  # and looked at afterwards, so a claim about rendering is answered with the
  # frame rather than with an argument about the code.
  #
  # It needs KVM, which a GitHub runner has and a development container here
  # does not — which is the whole reason this lives in CI and not in a script.
  # ---------------------------------------------------------------------------
  screenshots:
    name: Screenshots (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # the runner ships KVM but not permission to use it
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app and photograph it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_c
          # swiftshader gives GL ES 3, which the manifest requires
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-snapshot
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
            mkdir -p shots
            # Android/media, because Android 11 closed Android/data to the
            # shell user: the pull fails there against files that do exist
            adb pull /sdcard/Android/media/art.plume.anvil/shots shots || true
            ls -la shots
            adb logcat -d > shots/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anvil-screenshots
          path: shots/**
          if-no-files-found: warn
