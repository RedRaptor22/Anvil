name: Build

# Every push builds two things: the core's tests, which need only a JDK, and a
# debug APK you can install on a phone. The APK is attached to the run as an
# artifact, so there is nothing to build locally just to try the app — the same
# reason the web build deploys itself to Pages on every push.
on:
  push:
    # Work branches build too. There is no Android SDK on a development
    # machine here, so CI is the ONLY place :app is compiled at all — limiting
    # the APK job to main meant every change to the Android half went unbuilt
    # until it merged, which is exactly backwards.
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core tests (no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # -PcoreOnly excludes :app outright. A runner has ANDROID_HOME set
      # whether or not you want it, so without this the job that is meant to
      # prove core needs no SDK quietly configures the Android module too.
      - run: ./gradlew :core:test -PcoreOnly --no-daemon
      # The APK job proves :app compiles, which is not the same as
      # proving it launches: a control read before its builder has made
      # it is a runtime fault, and it kept the app from opening at all
      # for four commits. This is the check that sees it.
      - run: python3 tools/initorder.py

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: anvil-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
